# ─────────────────────────────────────────────────────────────────────────────
# Kustomization — lê o .env da raiz da infraestrutura
# Uso: kubectl apply -k .
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiap-oficina

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: oficina-secrets
    envs:
      - .env

resources:
  - k8s/00-namespace.yaml
  - k8s/01-configmap.yaml
  - k8s/03-rabbitmq.yaml
  - k8s/mysql/03-mysql.yaml
  - k8s/mysql-payment/03-mysql-payment.yaml
  - k8s/mongo/03-mongo.yaml
  - k8s/app/04-deployment.yaml
  - k8s/app/05-service-ingress.yaml
  - k8s/app/06-hpa.yaml

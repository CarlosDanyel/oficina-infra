# ─────────────────────────────────────────────────────────────────────────────
# Kustomization — aplica todos os manifests de uma vez
#
# Uso: kubectl apply -k k8s/
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiap-oficina

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - mysql/03-mysql.yaml
  - app/04-deployment.yaml
  - app/05-service-ingress.yaml
  - app/06-hpa.yaml

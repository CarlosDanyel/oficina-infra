apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: fiap-oficina
  labels:
    app: tech-challenge-fase3
data:
  DB_HOST: "mysql-service-order"
  DB_PORT: "3306"
  DB_NAME: "oficina_db"
  DB_USERNAME: "oficina_user"
  DB_PAY_HOST: "mysql-payment"
  DB_PAY_PORT: "3306"
  DB_PAY_NAME: "payment_db"
  DB_PAY_USERNAME: "oficina_user"
  MYSQL_SO_PORT: "3307"
  MYSQL_SO_DB: "oficina_db"
  MYSQL_SO_USER: "oficina_user"
  MYSQL_PAY_PORT: "3308"
  MYSQL_PAY_DB: "payment_db"
  MYSQL_PAY_USER: "oficina_user"
  MONGO_PORT: "27017"
  MONGO_DB: "notification_db"
  MONGO_URI: "mongodb://root:root_password@mongo:27017/notification_db?authSource=admin"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: "guest"
  APP_BASE_URL: "http://localhost:8080"
  RESEND_FROM_EMAIL: "oficina@fabrincahub.com"
  SPRING_JPA_SHOW_SQL: "false"
  LOGGING_LEVEL_COM_FIAP: "INFO"
